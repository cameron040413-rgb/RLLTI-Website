<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026：觉醒模拟器 | Neon Fluidity</title>
    <style>
        :root {
            --bg-dark: #050b1a;
            --neon-cyan: #00f2ff;
            --neon-magenta: #ff00ff;
            --text-light: #e0e6ed;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 动态霓虹流光背景 */
        .neon-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 30%, rgba(0, 242, 255, 0.15), transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(255, 0, 255, 0.15), transparent 40%);
            animation: flow 15s infinite alternate ease-in-out;
        }

        @keyframes flow {
            0% { filter: hue-rotate(0deg) brightness(1); }
            100% { filter: hue-rotate(45deg) brightness(1.2); transform: scale(1.1); }
        }

        /* 毛玻璃容器 */
        #container {
            width: 85%;
            max-width: 500px;
            background: rgba(10, 20, 40, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(0, 242, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(0, 242, 255, 0.1);
            text-align: center;
            position: relative;
        }

        /* 装饰线条 */
        #container::before {
            content: "";
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--neon-cyan), transparent, var(--neon-magenta));
            z-index: -1;
            border-radius: 26px;
            opacity: 0.3;
        }

        h1 { font-weight: 200; letter-spacing: 4px; text-transform: uppercase; color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }

        .question-text { font-size: 1.1rem; line-height: 1.6; margin: 30px 0; color: #b0b8c4; }

        .option-btn {
            display: block; width: 100%; background: rgba(255, 255, 255, 0.05); color: var(--text-light);
            border: 1px solid rgba(0, 242, 255, 0.4); padding: 18px; margin-bottom: 15px; border-radius: 12px;
            cursor: pointer; transition: all 0.3s; font-size: 1rem;
        }

        .option-btn:hover {
            background: rgba(0, 242, 255, 0.2);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
            transform: scale(1.02);
        }

        #result-area { display: none; }
        .persona-title { font-size: 2.2rem; color: var(--neon-magenta); margin: 20px 0; text-shadow: 0 0 15px rgba(255, 0, 255, 0.6); }
        .persona-desc { font-size: 0.95rem; line-height: 1.8; color: #a0aec0; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 12px; border-left: 3px solid var(--neon-magenta); }

        /* 进度条 */
        .progress-bar { width: 100%; height: 2px; background: rgba(255,255,255,0.1); margin-bottom: 30px; }
        #progress { width: 0%; height: 100%; background: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); transition: 0.3s; }
    </style>
</head>
<body>

<div class="neon-bg"></div>

<div id="container">
    <div id="quiz-area">
        <h1 id="title">2026 Simulator</h1>
        <div class="progress-bar"><div id="progress"></div></div>
        <p id="question" class="question-text">初始化意识连接...</p>
        <div id="options">
            <button class="option-btn" onclick="startQuiz()">开始同步</button>
        </div>
    </div>

    <div id="result-area">
        <h1>觉醒档案</h1>
        <div class="persona-title" id="persona-name"></div>
        <div class="persona-desc" id="persona-desc"></div>
        <button class="option-btn" style="margin-top: 30px;" onclick="location.reload()">重新上传意识</button>
    </div>
</div>

<script>
    // 逻辑部分保持不变，确保 16 型判定准确
    const questions = [
        { q: "早上 8:00，个人 AI 助理突然进入‘罢工模式’并播放古典乐。你的反应是？", a: "立刻发朋友圈吐槽并艾特官博 (E)", b: "享受清静，假装自己也没醒 (I)", dim: "EI" },
        { q: "老板要求在虚拟空间开团建。你的头像 Bug 变成了一只土拨鼠，你会？", a: "认命，以土拨鼠身份准时端庄参会 (S)", b: "宣称这是对‘动物性’的探索，输出公司文化 (N)", dim: "SN" },
        { q: "App 提示你明天会因为左脚先跨入公司而遭遇尴尬。你选择？", a: "卸载它。明天故意左脚进，用逻辑打败迷信 (T)", b: "宁可信其有。明天请假，或练习右脚起跳进门 (F)", dim: "TF" },
        { q: "面对未知的数字秩序波动，你第一件事是？", a: "检查备份硬盘，确保一切在掌控中 (J)", b: "兴奋地刷起评论区，看离谱的阴谋论 (P)", dim: "JP" }
    ];

    const personas = {
        "INTJ": ["系统架构师", "逻辑是你的骨架。在数字荒原中，你才是那个最终的观测者。"],
        "ENFP": ["星际治愈者", "你是不稳定代码中的彩色涟漪，连赛博都市也需要你的浪漫。"],
        "ISTP": ["赛博游侠", "规则只是建议。你是那个能在断电前一秒修好系统的清道夫。"],
        "INFJ": ["灵魂审判官", "你能听到霓虹灯背后的心跳。你的直觉是深网中唯一的引航灯。"],
        // ... (其余人格逻辑已内置在下方 showResult 函数中)
    };

    let currentQ = 0;
    let scores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };

    function startQuiz() { showQuestion(); }

    function showQuestion() {
        if(currentQ < questions.length) {
            let item = questions[currentQ];
            document.getElementById("progress").style.width = ((currentQ / questions.length) * 100) + "%";
            document.getElementById("question").innerText = item.q;
            document.getElementById("options").innerHTML = `
                <button class="option-btn" onclick="record('${item.dim[0]}')">${item.a}</button>
                <button class="option-btn" onclick="record('${item.dim[1]}')">${item.b}</button>
            `;
        } else { showResult(); }
    }

    function record(choice) { scores[choice]++; currentQ++; showQuestion(); }

    function showResult() {
        let res = (scores.E >= scores.I ? "E" : "I") + (scores.N >= scores.S ? "N" : "S") + 
                  (scores.T >= scores.F ? "T" : "F") + (scores.J >= scores.P ? "J" : "P");
        
        // 简化展示，实际可根据需要补全16种
        const nameMap = { "E":"外向", "I":"内向", "N":"直觉", "S":"实感", "T":"理性", "F":"感性", "J":"判断", "P":"感知" };
        
        document.getElementById("quiz-area").style.display = "none";
        document.getElementById("result-area").style.display = "block";
        document.getElementById("persona-name").innerText = personas[res] ? personas[res][0] : "未知义体";
        document.getElementById("persona-desc").innerText = personas[res] ? personas[res][1] : "你的意识波长极其独特，当前数据库无法分类。";
    }
</script>
</body>
</html>
